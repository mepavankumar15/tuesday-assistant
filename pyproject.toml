[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "JARVIS — An Alexa-style multi-agent AI assistant powered by CrewAI and Grok xAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "assistant", "crewai", "grok", "streamlit", "multi-agent"]

dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.17.0",
    "streamlit>=1.40.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "youtube-search-python>=1.6.6",
    "streamlit-player>=0.1.5",
    "litellm>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx<0.28.0",
    "tenacity>=9.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "black>=24.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
